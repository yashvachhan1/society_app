# Static analysis configuration for the Society App.
# Tuned for a clean `flutter analyze` (feeds SonarQube via the sonar-flutter plugin).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat these as warnings so they never silently slip into the codebase.
    avoid_print: warning
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "lib/generated/**"

linter:
  rules:
    # Const correctness (performance + cleaner widget tree)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Immutability & safety
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_redundant_argument_values
    - use_super_parameters

    # Readability / maintainability (reduces SonarQube code smells)
    - unnecessary_parenthesis
    - unnecessary_lambdas
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_decorated_box
    - prefer_single_quotes
    - directives_ordering
    - sort_constructors_first

    # Async correctness (avoids bugs SonarQube flags)
    - unawaited_futures
    - avoid_void_async
