name: society_admin
description: "Society Management — Admin Web Dashboard (Phase 1)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Shared monorepo design system — SAME blue theme, colors, widgets and
  # formatters as the resident mobile app (apps/resident).
  society_core:
    path: ../../packages/core

  # Navigation (sidebar routing)
  go_router: ^14.6.3

  # Dashboard charts
  fl_chart: ^0.70.2

  # Typography + formatting (shared transitively via core, kept explicit)
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
