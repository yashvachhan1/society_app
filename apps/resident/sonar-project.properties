# SonarQube configuration for the Society App (uses the community sonar-flutter plugin).
# Run:  flutter test --machine --coverage > test-report.json  &&  sonar-scanner

sonar.projectKey=society_app
sonar.projectName=Society Management App
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Only the Dart application code is analyzed; platform folders are excluded.
sonar.sources=lib
sonar.tests=test

# Generated and platform code never count toward quality metrics.
sonar.exclusions=lib/generated/**,**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart

# Reports produced by `flutter test --machine --coverage`.
sonar.flutter.tests.reportPath=test-report.json
sonar.flutter.coverage.reportPath=coverage/lcov.info
