name: society_owner
description: "Society Management — Owner / Super-Admin Console (manages all societies)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Shared monorepo design system + dashboard kit (shell, cards, stat tiles,
  # bar chart, theme). Same blue theme as the resident & admin apps.
  # fl_chart, google_fonts and intl come transitively via society_core.
  society_core:
    path: ../../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used by widget tests to disable font network fetching for determinism.
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
